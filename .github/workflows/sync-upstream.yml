name: Sync fork
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
